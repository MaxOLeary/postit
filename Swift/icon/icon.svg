<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Apple macOS icon-grid shadow: 30% black, y-offset 10, blur 10 at 1024 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- soft charcoal, faintly lighter at the top -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824x824 rounded square centered, 100px margin, r 185.4 -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#tile)" filter="url(#shadow)"/>

  <!-- Max's pixel speech bubble: the 16x16 grid from sketchybar/icon/grid.txt,
       one 30px square per cell, drawn as horizontal runs. Deliberately crisp
       pixel art - same mark as the menu bar and SketchyBar. -->
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="332" y="272" width="360" height="30"/>
    <rect x="302" y="302" width="30" height="30"/><rect x="692" y="302" width="30" height="30"/>
    <rect x="272" y="332" width="30" height="30"/><rect x="722" y="332" width="30" height="30"/>
    <rect x="272" y="362" width="30" height="30"/><rect x="362" y="362" width="330" height="30"/><rect x="722" y="362" width="30" height="30"/>
    <rect x="272" y="392" width="30" height="30"/><rect x="722" y="392" width="30" height="30"/>
    <rect x="272" y="422" width="30" height="30"/><rect x="362" y="422" width="180" height="30"/><rect x="722" y="422" width="30" height="30"/>
    <rect x="272" y="452" width="30" height="30"/><rect x="722" y="452" width="30" height="30"/>
    <rect x="272" y="482" width="30" height="30"/><rect x="362" y="482" width="270" height="30"/><rect x="722" y="482" width="30" height="30"/>
    <rect x="272" y="512" width="30" height="30"/><rect x="722" y="512" width="30" height="30"/>
    <rect x="272" y="542" width="30" height="30"/><rect x="722" y="542" width="30" height="30"/>
    <rect x="302" y="572" width="30" height="30"/><rect x="692" y="572" width="30" height="30"/>
    <rect x="332" y="602" width="90" height="30"/><rect x="512" y="602" width="180" height="30"/>
    <rect x="392" y="632" width="30" height="30"/><rect x="482" y="632" width="30" height="30"/>
    <rect x="392" y="662" width="30" height="30"/><rect x="452" y="662" width="30" height="30"/>
    <rect x="392" y="692" width="60" height="30"/>
    <rect x="392" y="722" width="30" height="30"/>
  </g>
</svg>
