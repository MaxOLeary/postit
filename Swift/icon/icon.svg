<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Apple macOS icon-grid shadow: 30% black, y-offset 10, blur 10 at 1024 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- soft charcoal, faintly lighter at the top -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824x824 rounded square centered, 100px margin, r 185.4 -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#tile)" filter="url(#shadow)"/>

  <!-- Note outline: 440x440 centered, r 78, all corners rounded -->
  <g fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <rect x="292" y="292" width="440" height="440" rx="78"/>
    <!-- three text lines: long, short, long -->
    <path d="M384 388 H640"/>
    <path d="M384 512 H544"/>
    <path d="M384 636 H640"/>
  </g>
</svg>
