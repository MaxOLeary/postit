<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9efff"/><stop offset="1" stop-color="#b9dcff"/>
    </linearGradient>
    <linearGradient id="pillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0ff"/><stop offset="0.6" stop-color="#1f7cff"/><stop offset="1" stop-color="#8fd0ff"/>
    </linearGradient>
    <linearGradient id="pillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8bff"/><stop offset="0.55" stop-color="#1414ff"/><stop offset="1" stop-color="#bfe0ff"/>
    </linearGradient>
    <linearGradient id="pillC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1cff"/><stop offset="0.6" stop-color="#0b3fd6"/><stop offset="1" stop-color="#ffe6c8"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1fff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#3b2aa8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6a4a3a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glassFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b28ff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#1c3fb8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0f5a8a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
        <g clip-path="url(#sq)">
          <rect width="1024" height="1024" fill="url(#bg)"/>
          <g filter="url(#blur)">
            <rect x="-40" y="-60" width="300" height="760" rx="150" fill="url(#pillA)"/>
            <rect x="290" y="-60" width="300" height="820" rx="150" fill="url(#pillB)"/>
            <rect x="620" y="-60" width="300" height="700" rx="150" fill="url(#pillC)"/>
            <rect x="950" y="-60" width="300" height="780" rx="150" fill="url(#pillA)"/>
          </g>
          <!-- 132-unit margin on all four sides: 1024 - 2*132 = 760 -->
          <g transform="translate(132 132)">
            <rect width="760" height="760" rx="68" fill="url(#glassFront)"/>
            <rect width="760" height="760" rx="68" fill="url(#sheen)"/>
            <rect x="4" y="4" width="752" height="752" rx="64" fill="none" stroke="url(#rim)" stroke-width="8"/>
            <!-- toolbar, top-left, same as the real note -->
            <g fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
              <path d="M62 82h56M90 54v56"/>
              <path d="M178 60l22 22-22 22"/>
              <circle cx="276" cy="82" r="22" fill="none"/>
            </g>
            <!-- thin plus -->
            <g stroke="#fff" stroke-opacity="0.92" stroke-width="22" stroke-linecap="round">
              <path d="M380 230v300M230 380h300"/>
            </g>
          </g>
        </g>
      </svg>